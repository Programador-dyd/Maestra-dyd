<th:block th:fragment="topbar(active)" xmlns:th="http://www.thymeleaf.org">
<header class="topbar">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú">☰</button>

  <div class="topbar-spacer"></div>

    <div class="profile-section" id="profileSection">
    <button type="button" class="profile-trigger" id="profileTrigger">
      <div class="avatar">
        <span th:text="${usuarioActual != null and !#strings.isEmpty(usuarioActual.nombre)}
                        ? ${#strings.toUpperCase(#strings.substring(usuarioActual.nombre, 0, 1))}
                        : 'U'">U</span>
      </div>
      <div>
        <span class="topbar-username" th:text="${usuarioActual != null ? usuarioActual.nombre : 'Usuario'}">Usuario</span>
        <span class="topbar-role" th:text="${usuarioActual != null ? usuarioActual.tipoEnObjeto : ''}"></span>
      </div>
    </button>

    <div class="profile-dropdown">
      <form class="logout-form" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="logout-btn">
          <span>Salir</span>
        </button>
      </form>
    </div>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/topbar-scroll.js}"></script>
<script th:src="@{/js/profile-dropdown.js}"></script>
</th:block>
