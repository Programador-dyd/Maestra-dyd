<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/layout.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/modulos.css}">
    <title th:text="${esModificar} ? 'Modificar tipo documento' : 'Adicionar tipo documento'"></title>
</head>
<body>

    <header th:replace="~{fragments/topbar :: topbar('tiposDocumento')}"></header>

    <aside th:replace="~{fragments/sidebar :: sidebar('tiposDocumento')}"></aside>

    <main>

        <div class="page-head">
            <div class="page-head-left">
                <div class="page-icon">
                    <img th:src="@{/img/logo.png}" alt="">
                </div>
                <div>
                    <h1 th:text="${esModificar} ? 'Modificar tipo documento' : 'Adicionar tipo documento'"></h1>
                    <p class="subtitle-main">Completa los datos del tipo de documento</p>
                </div>
            </div>
            <div class="actions">
                <a th:href="@{/tipos-documento}" class="btn">⬅ Volver</a>
            </div>
        </div>

        <div class="form-card">
            <form method="post" th:action="@{/tipoDocumentoFormulario}" th:object="${tipoDocumento}">

                <div class="form-grid">
                    <div class="form-field" th:if="${esModificar}">
                        <label>ID</label>
                        <input type="text" th:value="*{id}" readonly>
                    </div>

                    <div class="form-field">
                        <label>Nombre Tipo</label>
                        <input type="text" th:field="*{tipo}" maxlength="100" required>
                    </div>

                    <div class="form-field form-field-submit">
                        <label class="form-label-spacer"></label>
                        <div class="form-submit-wrap">
                            <input type="submit" th:value="${esModificar} ? 'Modificar' : 'Adicionar'">
                        </div>
                    </div>
                </div>

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            </form>
        </div>

    </main>

</body>
</html>
