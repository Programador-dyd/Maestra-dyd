<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/layout.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/modulos.css}">
    <title th:text="${esModificar} ? 'Modificar empleado' : 'Adicionar empleado'"></title>
</head>
<body>

    <header th:replace="~{fragments/topbar :: topbar('empleados')}"></header>

    <aside th:replace="~{fragments/sidebar :: sidebar('empleados')}"></aside>

    <main>

        <div class="page-head">
            <div class="page-head-left">
                <div class="page-icon">
                    <img th:src="@{/img/logo.png}" alt="">
                </div>
                <div>
                    <h1 th:text="${esModificar} ? 'Modificar empleado' : 'Adicionar nuevo empleado'"></h1>
                    <p class="subtitle-main">Completa los datos del empleado</p>
                </div>
            </div>
            <div class="actions">
                <a th:href="@{/empleados}" class="btn">⬅ Volver</a>
            </div>
        </div>

        <div class="form-card">
            <form method="post" th:action="@{/empleadosFormulario}" th:object="${empleado}">

                <div class="form-grid">
                    <div class="form-field">
                        <label>Identificación</label>
                        <input type="text" th:field="*{identificacion}"
                               maxlength="20" required
                               pattern="[0-9]+"
                               title="Solo se permiten números"
                               th:readonly="${esModificar}">
                    </div>

                    <div class="form-field">
                        <label>Nombre del empleado</label>
                        <input type="text" th:field="*{nombreEmpleado}" maxlength="150" required>
                    </div>

                    <div class="form-field">
                        <label>Fecha ingreso</label>
                        <input type="date" th:field="*{fechaIngreso}">
                    </div>

                    <div class="form-field form-field-submit">
                        <label class="form-label-spacer"></label>
                        <div class="form-submit-wrap">
                            <input type="submit" th:value="${esModificar} ? 'Modificar' : 'Adicionar'">
                        </div>
                    </div>
                </div>

                <input type="hidden" th:field="*{estado}">
                <input type="hidden" th:field="*{fechaRetiro}">
                <input type="hidden" name="identificacionAnterior" th:value="${identificacionAnterior}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            </form>
        </div>

    </main>

</body>
</html>
