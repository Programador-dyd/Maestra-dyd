<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/layout.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/modulos.css}">
    <title>Documentos del Empleado</title>
</head>
<body>

    <header th:replace="~{fragments/topbar :: topbar('empleados')}"></header>

    <aside th:replace="~{fragments/sidebar :: sidebar('empleados')}"></aside>

    <main>

        <div class="page-head">
            <div class="page-head-left">
                <div class="page-icon">
                    <img th:src="@{/img/logo.png}" alt="">
                </div>
                <div>
                    <h1>Documentos del Empleado</h1>
                    <p class="subtitle-main">
                        <span th:text="${empleado.identificacion}"></span> — <span th:text="${empleado.nombreEmpleado}"></span>
                    </p>
                </div>
            </div>
            <div class="actions">
                <a th:href="@{/empleados}" class="btn">⬅ Volver a Empleados</a>
            </div>
        </div>

        <div class="form-card">
            <h2 style="margin:0 0 16px; font-size:16px; color:#172033;">Subir nuevo documento</h2>
            <form th:action="@{/documentos-empleado/{id}/subir(id=${empleado.identificacion})}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-grid">
                    <div class="form-field">
                        <label>Categoría</label>
                        <select id="categoriaSelect">
                            <option value="">Selecciona una categoría</option>
                            <option th:each="entrada : ${tiposPorCategoria}" th:value="${entrada.key}" th:text="${entrada.key}"></option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>Tipo de documento</label>
                        <select name="tipo" id="tipoSelect" disabled required>
                            <option value="">Primero elige una categoría</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>Archivo</label>
                        <input type="file" name="archivo" required>
                    </div>

                    <div class="form-field form-field-submit">
                        <label class="form-label-spacer"></label>
                        <div class="form-submit-wrap">
                            <input type="submit" value="Subir a OneDrive">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <script th:inline="javascript">
            const tiposPorCategoria = /*[[${tiposPorCategoriaJson}]]*/ {};
        </script>
        <script th:src="@{/js/documentos-empleado.js}"></script>

    </main>

</body>
</html>
