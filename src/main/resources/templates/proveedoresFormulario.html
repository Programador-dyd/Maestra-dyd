<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/layout.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/modulos.css}">
    <title th:text="${esModificar} ? 'Modificar proveedor' : 'Adicionar proveedor'"></title>
</head>
<body>

    <header th:replace="~{fragments/topbar :: topbar('proveedores')}"></header>

    <aside th:replace="~{fragments/sidebar :: sidebar('proveedores')}"></aside>

    <main>

        <div class="page-head">
            <div class="page-head-left">
                <div class="page-icon">
                    <img th:src="@{/img/logo.png}" alt="">
                </div>
                <div>
                    <h1 th:text="${esModificar} ? 'Modificar proveedor' : 'Adicionar nuevo proveedor'"></h1>
                    <p class="subtitle-main">Completa los datos del proveedor</p>
                </div>
            </div>
            <div class="actions">
                <a th:href="@{/proveedores}" class="btn">⬅ Volver</a>
            </div>
        </div>

        <div class="form-card">
            <form method="post" th:action="@{/proveedoresFormulario}" th:object="${proveedor}">

                <div class="form-grid">
                    <div class="form-field">
                        <label>Nit proveedor</label>
                        <input type="text" th:field="*{nitProveedor}"
                               maxlength="30" required
                               pattern="[0-9]+"
                               title="Solo se permiten números"
                               th:readonly="${esModificar}">
                    </div>

                    <div class="form-field">
                        <label>Razón social</label>
                        <input type="text" th:field="*{razonSocial}" maxlength="100" required>
                    </div>

                    <div class="form-field">
                        <label>Fecha creación</label>
                        <input type="date" th:field="*{fechaSiesa}">
                    </div>

                    <div class="form-field form-field-submit">
                        <label class="form-label-spacer"></label>
                        <div class="form-submit-wrap">
                            <input type="submit" th:value="${esModificar} ? 'Modificar' : 'Adicionar'">
                        </div>
                    </div>
                </div>

                <input type="hidden" th:field="*{estado}">
                <input type="hidden" th:field="*{estadoDocumentacion}">
                <input type="hidden" th:field="*{tipoProveedor}">
                <input type="hidden" name="nitAnterior" th:value="${nitAnterior}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            </form>
        </div>

    </main>

</body>
</html>
