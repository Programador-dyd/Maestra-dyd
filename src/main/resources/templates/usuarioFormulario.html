<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/layout.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/estilos/modulos.css}">
    <title th:text="${esModificar} ? 'Modificar usuario' : 'Adicionar usuario'"></title>
</head>
<body>

    <header th:replace="~{fragments/topbar :: topbar('usuarios')}"></header>

    <aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>

    <main>

        <div class="page-head">
            <div class="page-head-left">
                <div class="page-icon">
                    <img th:src="@{/img/logo.png}" alt="">
                </div>
                <div>
                    <h1 th:text="${esModificar} ? 'Modificar usuario' : 'Adicionar usuario'"></h1>
                    <p class="subtitle-main">Completa los datos del usuario</p>
                </div>
            </div>
            <div class="actions">
                <a th:href="@{/usuarios}" class="btn">⬅ Volver</a>
            </div>
        </div>

        <div class="form-card">
            <form method="post" th:action="@{/usuarioFormulario}" th:object="${usuario}">

                <div class="form-grid">
                    <div class="form-field">
                        <label>Identificación</label>
                        <input type="text" th:field="*{identificacion}" maxlength="12" required
                               th:readonly="${esModificar}">
                    </div>

                    <div class="form-field">
                        <label>Nombres</label>
                        <input type="text" th:field="*{nombre}" maxlength="50" required>
                    </div>

                    <div class="form-field">
                        <label>Apellidos</label>
                        <input type="text" th:field="*{apellido}" maxlength="50" required>
                    </div>

                    <div class="form-field">
                        <label>Rol</label>
                        <select th:field="*{rol}" id="rolSelect">
                            <option value="A">Administrador</option>
                            <option value="U">Usuario</option>
                            <option value="E">Empleado</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>Fecha de ingreso</label>
                        <input type="date" name="fechaIngresoEmpleado" id="fechaIngresoEmpleado" disabled>
                    </div>
                    <div class="form-field">
                        <label>Contraseña</label>
                        <input type="password" th:field="*{clave}"
                               th:placeholder="${esModificar} ? 'Dejar en blanco para no cambiarla' : ''">
                    </div>

                    <div class="form-field form-field-submit">
                        <label class="form-label-spacer"></label>
                        <div class="form-submit-wrap">
                            <input type="submit" th:value="${esModificar} ? 'Modificar' : 'Adicionar'">
                        </div>
                    </div>
                </div>

                <input type="hidden" name="identificacionAnterior" th:value="${identificacionAnterior}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            </form>
        </div>

        <script th:src="@{/js/usuario-formulario.js}"></script>

    </main>

</body>
</html>
